# Builds the Android app on every push to main and publishes it in the "Latest APK" release:
#   FinanceFamily.apk  the full app, for a first install or when the Android wrapper changed
#   bundle.zip         only the web content, which installed apps download to update themselves
# The release notes carry the version of the build; installed apps read it to know an update exists.
# When package.json has a version that was not released yet, a permanent "vX.Y.Z" release is added too.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is derived from git history

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Work out the version
        id: version
        run: node deploy/scripts/version.mjs --github | tee -a "$GITHUB_OUTPUT"

      - name: Build the web app
        run: npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Build the APK
        working-directory: deploy/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain ${{ steps.version.outputs.gradle }}

      - name: Name the APK and pack the web content
        run: |
          cp deploy/android/app/build/outputs/apk/debug/app-debug.apk FinanceFamily.apk
          (cd dist && zip -qr ../bundle.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceFamily-apk
          path: |
            FinanceFamily.apk
            bundle.zip

      - name: Publish as the "Latest APK" release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          MANIFEST: ${{ steps.version.outputs.json }}
        run: |
          # The comment line is what installed apps read (src/lib/update.ts); keep its format.
          notes="Version $VERSION, build $BUILD, from commit ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC'). Download FinanceFamily.apk below and open it on the phone. Installed apps update themselves from bundle.zip.

          $(node deploy/scripts/version.mjs --notes)

          <!-- update-manifest $MANIFEST -->"
          if gh release view latest-apk > /dev/null 2>&1; then
            # Files first, notes last: an app must not learn about a build before its files are there.
            gh release upload latest-apk FinanceFamily.apk bundle.zip --clobber
            gh release edit latest-apk --notes "$notes"
          else
            gh release create latest-apk FinanceFamily.apk bundle.zip --title "Latest APK" --notes "$notes" --prerelease
          fi

      - name: Keep a permanent release for a new version number
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" FinanceFamily.apk bundle.zip --target "$GITHUB_SHA" --title "v$VERSION" --notes "$(node deploy/scripts/version.mjs --notes)"
          fi
